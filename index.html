<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Explore Amex small merchants in Singapore." />
    <title>Amex Small Merchant Map · Singapore</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="styles.css?v=11" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#map" aria-label="Amex Small Merchant Map home">
        <span class="brand-mark">AMEX</span>
        <span>Small Merchant Map <em>Singapore</em></span>
      </a>
      <form id="search-form" class="search-form" role="search">
        <label class="visually-hidden" for="search-input">Search merchants, places, or a Singapore address</label>
        <div class="search-field">
          <span id="active-place-chip" class="search-place-chip" hidden>
            <span id="active-place-label"></span>
            <button id="clear-place-button" type="button" aria-label="Remove place filter">×</button>
          </span>
          <input id="search-input" type="search" placeholder="Search merchants, malls, streets, or addresses" autocomplete="off" role="combobox" aria-controls="search-results" aria-expanded="false" aria-autocomplete="list" />
        </div>
        <button type="submit">Find</button>
        <div id="search-results" class="search-results" role="listbox" hidden></div>
      </form>
      <button id="locate-button" class="location-button" type="button">◎ Use my location</button>
    </header>

    <main class="app-shell">
      <section class="map-panel" aria-label="Map of Singapore merchants">
        <div id="map" aria-label="Interactive map of Amex small merchants in Singapore"></div>
        <div id="distance-origin-reticle" class="distance-origin-reticle" aria-hidden="true" hidden></div>
        <div class="map-caption">Pins represent merchant locations. Zoom in to explore the area.</div>
      </section>

      <aside id="directory-panel" class="directory-panel" aria-label="Merchants in current map view">
        <div class="directory-intro">
          <p id="directory-scope-label" class="eyebrow">In this map view</p>
          <h1><span id="merchant-count">Loading</span> merchants</h1>
          <p id="status" class="status" aria-live="polite">Loading the directory…</p>
        </div>
        <div id="category-filters" class="category-filters" aria-label="Filter by category"></div>
        <div class="directory-controls">
          <div class="sort-control" role="group" aria-label="Sort merchants">
            <button type="button" data-sort-mode="alphabetical" aria-pressed="true">A–Z</button>
            <button type="button" data-sort-mode="distance" aria-pressed="false">Nearest</button>
          </div>
        </div>
        <div id="merchant-list" class="merchant-list" aria-live="polite"></div>
      </aside>
    </main>

    <template id="merchant-template">
      <article class="merchant-card">
        <button class="merchant-select" type="button">
          <span class="visually-hidden merchant-select-label"></span>
        </button>
        <span class="merchant-category"></span>
        <strong class="merchant-name"></strong>
        <button class="merchant-location" type="button"></button>
        <span class="merchant-address"></span>
        <span class="merchant-distance" hidden></span>
        <a class="gmap-link" target="_blank" rel="noopener noreferrer">gmap ↗</a>
      </article>
    </template>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script type="module" src="app.js?v=18"></script>
  </body>
</html>
